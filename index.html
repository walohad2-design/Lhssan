<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تنبيه مهم - سي حسن بوكرين</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #0f172a; color: #fff; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
        .container { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 20px; padding: 25px; text-align: center; max-width: 480px; width: 100%; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .main-img { width: 100%; height: auto; max-height: 350px; object-fit: cover; border-radius: 15px; margin-bottom: 20px; border: 2px solid rgba(255, 255, 255, 0.2); }
        .warning-icon { font-size: 40px; margin-bottom: 10px; }
        h1 { font-size: 24px; color: #f87171; margin-bottom: 15px; text-transform: uppercase; }
        .message-box { background: rgba(239, 68, 68, 0.15); border: 2px solid #ef4444; padding: 20px; border-radius: 12px; margin-bottom: 20px; }
        .message-box p { font-size: 18px; line-height: 1.6; font-weight: bold; color: #fca5a5; direction: rtl; }
        .footer { font-size: 13px; color: #94a3b8; }
    </style>
</head>
<body>
    <div class="container">
        <img class="main-img" src="IMG_3664.jpeg" alt="Lhassan Bougrine">
        <div class="warning-icon">⚠️</div>
        <h1>تنبيه مهم جداً</h1>
        <div class="message-box">
            <p>سي حسن بوكرين، ما تبقاش أي حاجة تصيفطات ليك تورك عليها، راه غادي يمشيو ليك الفلوس وغادي تولي ف مشكيل مع البوليس!</p>
        </div>
        <div class="footer">رسالة تحذيرية • Official Notice</div>
    </div>
</body>
</html>
